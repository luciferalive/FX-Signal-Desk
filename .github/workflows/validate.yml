name: validate
# Replays the bot's rules over past prices and shows how often the signals worked.
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Pair, for example EURUSD"
        required: true
        default: "EURUSD"
      mode:
        description: "Style"
        required: true
        type: choice
        options: [swing, scalp, daily]
        default: swing

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Replay history
        env:
          SYMBOL: ${{ inputs.symbol }}
          MODE: ${{ inputs.mode }}
        run: |
          python -m fxbot validate --symbol "$SYMBOL" --mode "$MODE" | tee report.txt
          { echo "### Validation: $SYMBOL ($MODE)"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
